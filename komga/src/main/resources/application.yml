application.version: ${version}

logging:
  logback:
    rollingpolicy:
      max-history: 7
      total-size-cap: 1GB
      clean-history-on-start: true
      max-file-size: 10MB
  file:
    name: \${komga.config-dir}/logs/komga.log
  level:
    org.apache.activemq.audit: WARN
    org.apache.fontbox.cff.Type1CharString: ERROR
    org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer: ERROR

komga:
  database:
    file: \${komga.config-dir}/database.sqlite
    # CUSTOM FORK: the SQLite write path is a single connection (journal-mode WAL forces the
    # write pool to 1). With the driver default `synchronous=FULL` every commit fsyncs, so a
    # metadata refresh took 500-800ms and 16 task threads queued behind one HikariCP connection:
    # a full rescan produced hundreds of thousands of tasks and took days.
    # NORMAL keeps WAL crash consistency for the database file, and the library itself is
    # rebuildable from the archive tree, so the traded durability is acceptable here.
    # Override with --komga.database.pragmas.synchronous=FULL if you disagree.
    pragmas:
      synchronous: NORMAL
  lucene:
    data-directory: \${komga.config-dir}/lucene
  fonts:
    data-directory: \${komga.config-dir}/fonts
  config-dir: \${user.home}/.komga
  tasks-db:
    file: \${komga.config-dir}/tasks.sqlite
    pragmas:
      synchronous: NORMAL
  sessions-db:
    file: \${komga.config-dir}/sessions.sqlite
    pragmas:
      synchronous: NORMAL
  jdbc-session-enabled: true

  # comic-meta: external PostgreSQL metadata DB (read-only).
  # MIGRATION: db-path (SQLite) is REMOVED. The PG schema is not flat:
  #   source-id selects the TABLE PREFIX (jm / pica / wnacg; anything else is rejected)
  #   and tags live on the work, reached through volume -> work -> work_tags -> tags.
  # Leave enabled: false unless you really have this DB; lookups then return null
  # and Komga behaves exactly as before. NEVER commit a real password here.
  #
  # comic-meta:
  #   enabled: true
  #   db-url: jdbc:postgresql://host.docker.internal:55432/comic_meta
  #   db-user: comic
  #   db-password: \${COMIC_META_DB_PASSWORD}
  #   source-id: wnacg
  #   retry-cooldown-ms: 60000

spring:
  session:
    jdbc:
      # top of every hour
      cleanup-cron: "0 0 * * * *"
      initialize-schema: never
    timeout: 7d
  flyway:
    enabled: true
    locations: classpath:db/migration/{vendor}
    mixed: true
    placeholders:
      library-file-hashing: \${komga.file-hashing:true}
      library-scan-startup: \${komga.libraries-scan-startup:false}
      delete-empty-collections: \${komga.delete-empty-collections:true}
      delete-empty-read-lists: \${komga.delete-empty-read-lists:true}
  thymeleaf:
    prefix: classpath:/public/
  mvc:
    async:
      request-timeout: 1h
  web:
    resources:
      add-mappings: false
  jackson:
    deserialization:
      FAIL_ON_NULL_FOR_PRIMITIVES: true
    mapper:
      accept-case-insensitive-properties: true
      accept-case-insensitive-values: true
  config:
    import:
      - "optional:file:\${komga.config-dir}/application.yml"
      - "optional:file:\${komga.config-dir}/application.yaml"
      - "optional:file:\${komga.config-dir}/application.properties"
  http:
    codecs:
      max-in-memory-size: 10MB

server:
  servlet:
    session:
      cookie:
        name: KOMGA-SESSION
        max-age: \${spring.session.timeout}
  forward-headers-strategy: framework
  shutdown: graceful
  error:
    include-message: always
  port: 25600
  tomcat:
    relaxed-query-chars:
      - '{'
      - '}'
      - '['
      - ']'

management:
  endpoints.web.exposure.include: "*"
  endpoint:
    configprops:
      roles: ADMIN
      show-values: when_authorized
    env:
      roles: ADMIN
      show-values: when_authorized
    health:
      roles: ADMIN
      show-details: when_authorized
    shutdown:
      access: unrestricted
  info:
    java:
      enabled: true
    os:
      enabled: true
  simple:
    metrics:
      export:
        enabled: true
        step: 24h
springdoc:
  swagger-ui:
    disable-swagger-default-url: true
  paths-to-match: "/api/**"
  writer-with-order-by-keys: true
